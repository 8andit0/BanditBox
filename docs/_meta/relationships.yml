      "tools": [
        "python"
      ],
      "services": [],
      "commands": [
        "def extractor_de_idat(png_bytes):\n    chunks = []\n    i = 8",
        "while i < len(png_bytes):\n        length = int.from_bytes(png_bytes[i:i+4], byteorder='big')\n        chunk_type = png_bytes[i+4:i+8]",
        "if chunk_type == b'IDAT':\n            chunk_data = png_bytes[i+8:i+8+length]\n            chunks.append(chunk_data)",
        "i += 4 + 4 + length + 4",
        "return b''.join(chunks)"
      ]
